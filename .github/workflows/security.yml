name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  secrets:
    # Scans the whole history, so a secret that was committed and later removed is still found.
    # The binary is pinned by version and by checksum. The one allowance is in .gitleaks.toml.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml .

  audit:
    # Production dependencies only. Development tooling is not checked here, because none of it is
    # shipped in an image.
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        run: npm install --global pnpm@12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod
