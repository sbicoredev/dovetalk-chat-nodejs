name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here. See [SECURITY.md](https://github.com/OWNER/dovetalk/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, or the clicks in the app. A failing test is even better.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run it?
      options:
        - docker compose --profile app
        - docker compose --profile scale
        - Locally with pnpm
        - Web app on the mock server
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0, or the output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
