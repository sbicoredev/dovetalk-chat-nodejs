name: Set up the workspace
description: Node, pnpm, the locked install and the Turborepo cache.

inputs:
  install-args:
    description: Extra arguments for pnpm install, such as --filter "@dovetalk/web...".
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Keep in step with "packageManager" in the root package.json.
    - name: Install pnpm
      shell: bash
      run: npm install --global pnpm@12.21.0
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Restore the Turborepo cache
      # Used when no remote cache is configured (TURBO_TOKEN); with one, this only adds a local layer.
      uses: actions/cache@v4
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: turbo-${{ runner.os }}-${{ github.job }}-
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.install-args }}
