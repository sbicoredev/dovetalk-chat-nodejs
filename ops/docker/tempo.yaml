# Grafana Tempo 3, single binary (`-target=all`, set in docker-compose.yml), local disk. For a demo
# and local work, not for scale.
#
# Tempo 3 dropped the `compactor` block: compaction and retention are done by the backend worker, so
# the 24 hour retention below is `backend_worker.compaction.block_retention`.
stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Retention is set on the worker, which deletes the blocks, and on the scheduler, which hands out
# the compaction jobs with its own copy of the default (14 days).
backend_worker:
  compaction:
    block_retention: 24h

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 24h

usage_report:
  reporting_enabled: false
