# The load balancer of the Compose `scale` profile: one address in front of several API replicas.
#
# Why this is short. The API's sockets are WebSocket only (no long-polling, apps/api/src/realtime/
# redis-io.adapter.ts), so a connection is one TCP stream for its whole life and lands on one
# replica; REST requests carry a token and need no session. Nothing has to reach "the same
# replica as last time", so there is no ip_hash, no sticky cookie. Whatever replica holds a
# person's socket receives their events, because every event goes through Redis.

worker_processes auto;
# One WebSocket is two sockets here (client side and upstream side).
worker_rlimit_nofile 65536;

events {
  worker_connections 16384;
}

http {
  # `Connection: upgrade` only for WebSocket handshakes. For ordinary requests it is cleared, which
  # lets nginx keep its connections to the replicas open.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  upstream dovetalk_api {
    # The replica with the fewest open connections. WebSockets live for hours, so plain
    # round-robin would drift out of balance as people come and go.
    least_conn;
    # `scale-api` is the Compose service name. Docker's DNS answers with one address per
    # replica, and nginx makes one upstream server of each when it starts. A replica that
    # refuses connections is skipped for 5 s (passive health check) and its requests go to
    # another one. Replicas started later are seen after `docker compose restart lb`.
    server scale-api:3001 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  access_log off;
  # Short, so a stopped replica is noticed fast and the next one is tried.
  proxy_connect_timeout 2s;

  server {
    listen 8080;
    # The API's upload limit is 10 MB.
    client_max_body_size 11m;

    # nginx itself answers, for checking that the balancer is up without involving a replica.
    location = /lb/health {
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://dovetalk_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      # The API trusts one proxy (TRUST_PROXY=1), so rate limits see the visitor's address.
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # A socket is idle between messages. The API pings every 25 s, so an hour is plenty and
      # only a dead peer ends a connection.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      # If a replica is gone, try another for requests that are safe to repeat (nginx never
      # repeats a POST on its own). A send that failed is retried by the client with the same
      # clientId, which the API makes safe.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_next_upstream_tries 3;
    }
  }
}
