apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # A latency exemplar's trace_id opens in Tempo.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Trace to logs: from a span to the log lines of the same trace.
      tracesToLogsV2:
        datasourceUid: loki
        customQuery: true
        query: '{service_name=~".+"} | trace_id="$${__trace.traceId}"'
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
      tracesToMetrics:
        datasourceUid: prometheus
        queries:
          - name: Request rate
            query: "sum(rate(traces_span_metrics_calls_total{$$__tags}[1m]))"
        tags:
          - key: service.name
            value: service_name
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Log to trace: trace_id is structured metadata on OTLP logs, so match it as a field.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Open trace
